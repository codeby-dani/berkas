<!-- ============ TITLE ============ -->
<text x="60" y="56" font-size="37" font-weight="700" fill="#16233A" letter-spacing="-0.6">Berkas</text>
<text x="196" y="56" font-size="17" fill="#7A879C">an application-filing partner, for writing to an institution in a language that is not yours</text>
<text x="60" y="90" font-size="18.5" fill="#16233A">
  <tspan fill="#5B6A82">The model perceives.</tspan>
  <tspan font-weight="700" dx="8">Code decides.</tspan>
  <tspan fill="#C77B18" font-weight="700" dx="8">Nothing leaves without you.</tspan>
</text>
<text x="1580" y="46" text-anchor="end" font-size="13" font-weight="600" fill="#5B6A82">All Things Agentic  ·  Collaborative Partner track</text>
<text x="1580" y="68" text-anchor="end" font-size="12.5" class="m" fill="#8A94A6">berkas-jprtd3yasa-uc.a.run.app</text>
<text x="1580" y="90" text-anchor="end" font-size="12.5" fill="#C77B18" font-weight="600">4 gates  ·  3 of them are yours</text>

<!-- ============ BANDS ============ -->
<rect x="60" y="118" width="1520" height="170" rx="12" fill="#FDF6EA" stroke="#EEDBB8" stroke-width="1.5"/>
<rect x="60" y="300" width="1520" height="360" rx="12" fill="#F4F7FB" stroke="#D3DDEA" stroke-width="1.5"/>
<rect x="60" y="794" width="1520" height="86" rx="12" fill="#F3F4F6" stroke="#E1E4E9" stroke-width="1.5"/>

<rect x="78" y="107" width="52" height="22" rx="6" fill="#C77B18"/>
<text x="104" y="122.5" text-anchor="middle" font-size="12" font-weight="700" fill="#FFF" letter-spacing="1.2">YOU</text>

<rect x="78" y="289" width="92" height="22" rx="6" fill="#2C3E5E"/>
<text x="124" y="304.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFF" letter-spacing="1">BERKAS</text>

<rect x="78" y="783" width="82" height="22" rx="6" fill="#8A94A6"/>
<text x="119" y="798.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFF" letter-spacing="1">RUNS ON</text>

<!-- ============ YOU LANE CARDS ============ -->
<!-- A · what you give it -->
<rect x="80" y="140" width="240" height="126" rx="10" fill="#FFFDF8" stroke="#E0A64B" stroke-width="1.8"/>
<text x="98" y="167" font-size="16" font-weight="700" fill="#8A5A12">What you give it</text>
<text x="98" y="190" font-size="13" fill="#7A5F30"><tspan x="98">Your writing samples, a</tspan><tspan x="98" dy="17">recording of how you speak,</tspan><tspan x="98" dy="17">your background — and the</tspan><tspan x="98" dy="17">call for applications.</tspan></text>

<!-- B · GATE 1 -->
<rect x="340" y="140" width="250" height="126" rx="10" fill="#FFF6E5" stroke="#E0A64B" stroke-width="2.4" filter="url(#sh)"/>
<text x="358" y="166" font-size="14.5" font-weight="800" fill="#8A5A12" letter-spacing="0.3">GATE 1 · CORRECT IT</text>
<text x="358" y="190" font-size="13" fill="#7A5F30"><tspan x="358">You edit the machine's reading</tspan><tspan x="358" dy="17">before it becomes the rulebook.</tspan></text>
<rect x="358" y="228" width="214" height="21" rx="4" fill="#F7E7C9"/>
<text x="366" y="242.5" font-size="11.5" class="m" fill="#8A5A12">POST /draft → 409 until you do</text>

<!-- C · you answer -->
<rect x="610" y="152" width="200" height="102" rx="10" fill="#FFFDF8" stroke="#E0A64B" stroke-width="1.8"/>
<text x="628" y="179" font-size="16" font-weight="700" fill="#8A5A12">You answer</text>
<text x="628" y="202" font-size="13" fill="#7A5F30"><tspan x="628">Only the questions your</tspan><tspan x="628" dy="17">own files cannot answer.</tspan></text>

<!-- D · GATE 3 -->
<rect x="1010" y="140" width="265" height="126" rx="10" fill="#FFF6E5" stroke="#E0A64B" stroke-width="2.4" filter="url(#sh)"/>
<text x="1028" y="166" font-size="14.5" font-weight="800" fill="#8A5A12" letter-spacing="0.3">GATE 3 · ATTEST IT</text>
<text x="1028" y="190" font-size="13" fill="#7A5F30"><tspan x="1028">The checker flagged a claim it</tspan><tspan x="1028" dy="17">cannot trace. You vouch, per</tspan><tspan x="1028" dy="17">claim — and it is recorded.</tspan></text>

<!-- E · GATE 2 -->
<rect x="1330" y="140" width="230" height="126" rx="10" fill="#FFF6E5" stroke="#E0A64B" stroke-width="2.4" filter="url(#sh)"/>
<text x="1348" y="166" font-size="14.5" font-weight="800" fill="#8A5A12" letter-spacing="0.3">GATE 2 · SEND IT</text>
<text x="1348" y="190" font-size="13" fill="#7A5F30"><tspan x="1348">Explicit confirmation.</tspan><tspan x="1348" dy="17">Nothing auto-sends.</tspan></text>
<text x="1348" y="238" font-size="12.5" font-weight="700" fill="#BF3B2B">This one is irreversible.</text>

<!-- ============ MACHINE CARDS ============ -->
<!-- X1 TOP · Perception -->
<rect x="150" y="352" width="245" height="104" rx="10" fill="#FFF" stroke="#C4CFDE" stroke-width="1.6"/>
<text x="168" y="378" font-size="16.5" font-weight="700" fill="#16233A">Perception</text>
<text x="168" y="400" font-size="13" fill="#5B6A82"><tspan x="168">Reads the call document and</tspan><tspan x="168" dy="16">reports what it requires.</tspan><tspan x="168" dy="16" font-style="italic">It never scores anything.</tspan></text>
<rect x="150" y="440" width="245" height="16" rx="0" fill="none"/>
<text x="168" y="451" font-size="10" class="m" fill="#95A0B2">perception.py · gemini-3.7-flash</text>

<!-- X1 BOT · GATE 0 Authenticity -->
<rect x="150" y="478" width="245" height="104" rx="10" fill="#FFF" stroke="#C4CFDE" stroke-width="1.6"/>
<rect x="150" y="478" width="245" height="5" rx="2.5" fill="#E0A64B"/>
<text x="168" y="506" font-size="16.5" font-weight="700" fill="#16233A">Authenticity</text>
<rect x="316" y="491" width="62" height="18" rx="4" fill="#FBEFD8"/>
<text x="347" y="504" text-anchor="middle" font-size="10.5" font-weight="800" fill="#8A5A12" letter-spacing="0.5">GATE 0</text>
<text x="168" y="527" font-size="13" fill="#5B6A82"><tspan x="168">Judges the writing sample.</tspan><tspan x="168" dy="16">A model-written sample is</tspan><tspan x="168" dy="16" fill="#BF3B2B">refused, markers quoted back.</tspan></text>
<text x="168" y="577" font-size="10" class="m" fill="#95A0B2">authenticity.py · gemini-3.7-flash</text>

<!-- X2 TOP · Interview -->
<rect x="441" y="352" width="245" height="104" rx="10" fill="#FFF" stroke="#C4CFDE" stroke-width="1.6"/>
<text x="459" y="378" font-size="16.5" font-weight="700" fill="#16233A">Interview</text>
<text x="459" y="400" font-size="13" fill="#5B6A82"><tspan x="459">Asks only for evidence the</tspan><tspan x="459" dy="16">call demands and your own</tspan><tspan x="459" dy="16">files do not already hold.</tspan></text>
<text x="459" y="451" font-size="10.5" class="m" fill="#95A0B2">interview.py · evidence.py</text>

<!-- X2 BOT · Evidence routing -->
<rect x="441" y="478" width="245" height="104" rx="10" fill="#FFF" stroke="#C4CFDE" stroke-width="1.6"/>
<text x="459" y="506" font-size="16.5" font-weight="700" fill="#16233A">Evidence routing</text>
<text x="459" y="527" font-size="13" fill="#5B6A82"><tspan x="459">Routes each of your files to</tspan><tspan x="459" dy="16">the section it actually</tspan><tspan x="459" dy="16">supports.</tspan></text>
<text x="459" y="577" font-size="10" class="m" fill="#95A0B2">classify.py · gemma-4-26b-a4b-it</text>

<!-- X3 · Drafting -->
<rect x="732" y="415" width="245" height="104" rx="10" fill="#FFF" stroke="#C4CFDE" stroke-width="1.6"/>
<text x="750" y="441" font-size="16.5" font-weight="700" fill="#16233A">Drafting</text>
<text x="750" y="463" font-size="13" fill="#5B6A82"><tspan x="750">Writes against the corrected</tspan><tspan x="750" dy="16">spec, in your voice, at your</tspan><tspan x="750" dy="16">documented spoken level.</tspan></text>
<text x="750" y="514" font-size="10.5" class="m" fill="#95A0B2">drafting.py · speaking.py</text>

<!-- X4 · Compliance (the heavy one) -->
<rect x="1023" y="392" width="245" height="150" rx="10" fill="#FFF" stroke="#111827" stroke-width="3.2" filter="url(#sh)"/>
<text x="1041" y="420" font-size="17.5" font-weight="800" fill="#111827">Compliance</text>
<rect x="1186" y="405" width="64" height="19" rx="4" fill="#BF3B2B"/>
<text x="1218" y="418.5" text-anchor="middle" font-size="10.5" font-weight="800" fill="#FFF" letter-spacing="0.6">BLOCKS</text>
<text x="1041" y="441" font-size="13.5" font-weight="800" fill="#111827">plain Python. no model here.</text>
<text x="1041" y="462" font-size="13" fill="#5B6A82"><tspan x="1041">Word caps, missing sections,</tspan><tspan x="1041" dy="16">and any claim not traceable</tspan><tspan x="1041" dy="16">to your own files.</tspan><tspan x="1041" dy="16" font-style="italic">Same draft, same verdict.</tspan></text>
<text x="1041" y="537" font-size="10.5" class="m" fill="#95A0B2">compliance.py · stdlib only</text>

<!-- X5 · Submitter -->
<rect x="1314" y="415" width="245" height="104" rx="10" fill="#FFF" stroke="#C4CFDE" stroke-width="1.6"/>
<text x="1332" y="441" font-size="16.5" font-weight="700" fill="#16233A">Submitter</text>
<text x="1332" y="463" font-size="13" fill="#5B6A82"><tspan x="1332">Files it for real, and writes</tspan><tspan x="1332" dy="16">back a timestamped receipt.</tspan></text>
<text x="1332" y="514" font-size="10.5" class="m" fill="#95A0B2">submitter.py · Gmail API</text>

<rect x="104" y="596" width="4" height="56" rx="2" fill="#E0A64B"/>
<text x="122" y="610" font-size="11.5" font-weight="800" fill="#8A5A12" letter-spacing="0.6">ON GATE 0</text>
<text x="122" y="629" font-size="12" fill="#6B7A90"><tspan x="122">A judgement, not a detector score. It quotes the markers it read, in your own</tspan><tspan x="122" dy="16">sample, so you can disagree with it. Non-native English is never one of them.</tspan></text>

<text x="1028" y="734" font-size="12.5" fill="#5B6A82"><tspan x="1028">What was sent, to whom, when,</tspan><tspan x="1028" dy="16">and every claim you attested.</tspan></text>

<rect x="1300" y="684" width="270" height="92" rx="10" fill="#EFF9F4" stroke="#127A57" stroke-width="3" filter="url(#sh)"/>

<text x="1318" y="737" font-size="12.5" fill="#2A6B54"><tspan x="1318">Not a mock, not a preview.</tspan><tspan x="1318" dy="16">An actual person receives it.</tspan></text>
