name: Berkas CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      # --locked fails the run if uv.lock drifts from pyproject.toml, so the
      # badge cannot go green against dependencies nobody committed.
      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -q
