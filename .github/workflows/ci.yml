name: Berkas CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # --locked fails the run if uv.lock drifts from pyproject.toml, so the
      # badge cannot go green against dependencies nobody committed.
      - name: Install dependencies
        run: uv sync --locked

      # corpus/ is gitignored on purpose -- it holds real personal files. Without
      # this, a fresh clone has no bundled corpus and test_corpus.py fails on an
      # assertion about the applicant's disk rather than about the code.
      - name: Run tests
        env:
          BERKAS_CORPUS: corpus.example
        run: uv run pytest -q
