[project]
name = "hackathon-agent"
version = "0.1.0"
description = "All Things Agentic Hackathon entry"
readme = "README.md"
authors = [
    { name = "Dani", email = "dani.muhammad.k@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "google-adk>=2.8.0",
    "google-api-python-client>=2.199.0",
    "google-auth-oauthlib>=1.4.1",
    "google-cloud-firestore>=2.29.0",
    "google-cloud-secret-manager>=2.30.0",
    "pypdf>=6.16.2",
    "python-multipart>=0.0.32",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "reportlab>=5.0.1",
]

[tool.pytest.ini_options]
# The project is not installed as a package (tool.uv package = false), so point
# pytest at the repo root instead.
pythonpath = ["."]
testpaths = ["tests"]
